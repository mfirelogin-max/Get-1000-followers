<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get 1000 Free Followers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            color: white;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .input-group {
            position: relative;
            margin-top: 1.5rem;
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 12px 12px 45px;
            width: 100%;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.7;
        }

        .btn-claim {
            background: #fff;
            color: #C13584;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-top: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-claim:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .step-hidden { display: none; }

        /* Loader Styles */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="glass-card" id="main-card">
        <div id="step1" class="fade-in">
            <i class="fab fa-instagram fa-4x mb-4"></i>
            <h1 class="text-2xl font-bold">1,000 Followers</h1>
            <p class="text-sm opacity-80">अपना यूजरनेम दर्ज करें और फ्री फॉलोअर्स प्राप्त करें</p>
            
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Instagram Username..." autocomplete="off">
            </div>

            <button class="btn-claim" onclick="startProcess()">Claim Now</button>
        </div>

        <div id="step2" class="step-hidden fade-in">
            <h2 class="text-xl font-semibold mb-2">Connecting to Server...</h2>
            <div class="loader"></div>
            <p id="status-text" class="text-sm opacity-70">Searching for user...</p>
        </div>

        <div id="step3" class="step-hidden fade-in">
            <i class="fas fa-check-circle fa-4x mb-4 text-green-400"></i>
            <h2 class="text-2xl font-bold">Success!</h2>
            <p class="text-sm opacity-90 mt-2">1,000 फॉलोअर्स आपके अकाउंट पर भेजे जा रहे हैं।</p>
            <div class="bg-white/10 rounded-lg p-3 mt-4 text-xs">
                Estimated Time: 10-15 Minutes
            </div>
            <button class="btn-claim" onclick="location.reload()">Back</button>
        </div>
    </div>

    <script>
        function startProcess() {
            const user = document.getElementById('username').value;
            if (!user) {
                alert("कृपया यूजरनेम डालें!");
                return;
            }

            // UI Switch
            document.getElementById('step1').classList.add('step-hidden');
            document.getElementById('step2').classList.remove('step-hidden');

            const status = document.getElementById('status-text');
            const messages = [
                "Searching for @" + user + "...",
                "User Found!",
                "Initializing 1,000 followers...",
                "Verifying Security...",
                "Adding followers to database..."
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < messages.length) {
                    status.innerText = messages[i];
                    i++;
                } else {
                    clearInterval(interval);
                    showSuccess();
                }
            }, 1500);
        }

        function showSuccess() {
            document.getElementById('step2').classList.add('step-hidden');
            document.getElementById('step3').classList.remove('step-hidden');
        }
    </script>
</body>
</html>
