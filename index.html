<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get 1000 Free Followers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            -webkit-tap-highlight-color: transparent; /* Mobile touch highlight remove */
            user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* App view ke liye best */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            width: 92%;
            max-width: 380px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 14px 14px 14px 45px;
            width: 100%;
            color: white;
            outline: none;
            transition: 0.3s;
            font-size: 16px; /* Prevents iOS zoom */
        }

        .input-field:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-action {
            background: #fff;
            color: #C13584;
            font-weight: 700;
            padding: 14px;
            border-radius: 15px;
            width: 100%;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="glass-card">
        <div id="step1" class="fade-in">
            <div class="mb-6">
                <i class="fab fa-instagram fa-4s text-5xl"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Free Followers</h1>
            <p class="text-sm opacity-80 mb-6">अपना यूजरनेम डालें और प्रोसेस शुरू करें</p>
            
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-4 opacity-70"></i>
                <input type="text" id="username" class="input-field" placeholder="Insta Username..." autocomplete="off">
            </div>

            <button class="btn-action" onclick="handleStart()">Send 1000 Followers</button>
        </div>

        <div id="step2" class="hidden fade-in">
            <h2 id="status-head" class="text-xl font-semibold mb-2">Connecting...</h2>
            <div class="loader"></div>
            <p id="status-msg" class="text-sm opacity-70">Securing connection...</p>
        </div>

        <div id="step3" class="hidden fade-in">
            <i class="fas fa-check-circle text-6xl text-green-400 mb-4"></i>
            <h2 class="text-2xl font-bold">Done!</h2>
            <p class="text-sm opacity-90 mt-2">आपके फॉलोअर्स सफलतापूर्वक भेज दिए गए हैं।</p>
            <div class="bg-white/10 rounded-xl p-4 mt-6">
                <p class="text-xs">Processing ID: #RAJNI-8892</p>
                <p class="text-xs font-bold mt-1">Status: Delivering</p>
            </div>
            <button class="btn-action" onclick="resetApp()">Back</button>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const statusHead = document.getElementById('status-head');
        const statusMsg = document.getElementById('status-msg');

        function handleStart() {
            const user = document.getElementById('username').value.trim();
            if (user === "") {
                // Android-like vibrate or alert
                alert("Please enter a valid username!");
                return;
            }

            // UI Changes
            step1.classList.add('hidden');
            step2.classList.remove('hidden');

            const steps = [
                { h: "Searching...", m: `Finding @${user} on Instagram` },
                { h: "User Found!", m: "Verifying account status..." },
                { h: "Syncing...", m: "Initializing follower package" },
                { h: "Success!", m: "1000 followers Sending for username" }
            ];

            let count = 0;
            const process = setInterval(() => {
                if (count < steps.length) {
                    statusHead.innerText = steps[count].h;
                    statusMsg.innerText = steps[count].m;
                    count++;
                } else {
                    clearInterval(process);
                    showFinal();
                }
            }, 1800);
        }

        function showFinal() {
            step2.classList.add('hidden');
            step3.classList.remove('hidden');
        }

        // Fix for Back Button: Instead of closing, it resets UI
        function resetApp() {
            // Reset input
            document.getElementById('username').value = "";
            
            // UI Smooth Transition back to start
            step3.classList.add('hidden');
            step1.classList.remove('hidden');
            
            // Log for debugging
            console.log("App Reset Successfully");
        }

        // Handle Physical Back Button in Android WebView
        window.onpopstate = function() {
            if (!step1.classList.contains('hidden')) {
                // Exit logic here if needed
            } else {
                resetApp();
            }
        };
    </script>
</body>
    </html>
